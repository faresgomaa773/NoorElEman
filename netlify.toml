[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/azkar-al-sabah"
  to = "/morning"
  status = 301

[[redirects]]
  from = "/morning-azkar"
  to = "/morning"
  status = 301

[[redirects]]
  from = "/azkar-al-masaa"
  to = "/evening"
  status = 301

[[redirects]]
  from = "/evening-azkar"
  to = "/evening"
  status = 301

[[redirects]]
  from = "/islamic-duas"
  to = "/duas"
  status = 301

[[redirects]]
  from = "/prophetic-hadiths"
  to = "/hadith"
  status = 301

[[redirects]]
  from = "/ahadith-nabawiya"
  to = "/hadith"
  status = 301

[[redirects]]
  from = "/ahadith"
  to = "/hadith"
  status = 301

[[redirects]]
  from = "/holy-quran"
  to = "/quran"
